<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LapAKABogor Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }

    header {
      background: linear-gradient(to right, #007bff, #dc3545, #fd7e14, #28a745);
      color: white;
      padding: 1rem;
      text-align: center;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 1rem;
    }

    .category {
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
    }

    .search {
      display: flex;
      justify-content: center;
      margin: 1rem;
    }

    .search input {
      padding: 0.5rem;
      width: 300px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .product {
      border: 1px solid #ccc;
      margin: 0.5rem;
      padding: 1rem;
      border-radius: 10px;
      width: 200px;
      background: white;
    }

    .cart-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: #007bff;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
    }

    .cart {
      position: fixed;
      top: 3rem;
      right: 1rem;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 300px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 1rem;
      display: none;
      z-index: 1000;
    }

    .cart.active {
      display: block;
    }

    .cart.shrink {
      transform: scale(0.6);
      transition: transform 0.3s;
    }
  </style>
</head>

<body>
  <header>
    <h1>LapAKABogor Store</h1>
  </header>

  <div class="categories">
    <div class="category" onclick="filterCategory('Makanan Berat')">Makanan Berat 🍛</div>
    <div class="category" onclick="filterCategory('Makanan Ringan')">Makanan Ringan 🍪</div>
    <div class="category" onclick="filterCategory('Minuman')">Minuman 🥤</div>
    <div class="category" onclick="filterCategory('Kimia')">Alat dan Bahan Kimia ⚗️</div>
    <div class="category" onclick="filterCategory('Inovasi')">Inovasi Mahasiswa 💡</div>
    <div class="category" onclick="filterCategory('Lainnya')">Lain-lain 🛍️</div>
  </div>

  <div class="search">
    <input type="text" id="searchInput" placeholder="Cari produk..." onkeyup="searchProduct()">
  </div>

  <div class="products" id="productList">
    <!-- Contoh Produk -->
    <div class="product" data-category="Makanan Berat" data-name="Nasi Goreng">
      <h3>Nasi Goreng</h3>
      <p>Rp12.000</p>
      <button onclick="addToCart('Nasi Goreng', 12000)">Tambah ke Keranjang</button>
    </div>
    <!-- Tambahkan produk lainnya sesuai kategori -->
  </div>

  <div class="cart-toggle" onclick="toggleCart()">🛒 Keranjang</div>
  <div class="cart" id="cart" ondblclick="shrinkCart()">
    <h3>Keranjang Belanja</h3>
    <ul id="cartItems"></ul>
    <p>Total Item: <span id="totalItems">0</span></p>
    <p>Total Harga: Rp<span id="totalPrice">0</span></p>
    <hr>
    <input type="text" id="buyerName" placeholder="Nama Pembeli" style="width:100%; margin-bottom:0.5rem">
    <select id="pickupMethod" onchange="updateTotal()" style="width:100%; margin-bottom:0.5rem">
      <option value="ambil">Ambil Sendiri</option>
      <option value="antar">Diantar (Rp500/item)</option>
    </select>
    <select id="paymentMethod" style="width:100%; margin-bottom:0.5rem">
      <option value="qris">QRIS</option>
      <option value="cash">Cash</option>
    </select>
    <button onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
  </div>

  <script>
    let cart = [];
    let shrinkState = false;

    function filterCategory(category) {
      const products = document.querySelectorAll('.product');
      products.forEach(p => {
        p.style.display = p.dataset.category === category ? 'block' : 'none';
      });
    }

    function searchProduct() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.product').forEach(p => {
        const name = p.dataset.name.toLowerCase();
        p.style.display = name.includes(term) ? 'block' : 'none';
      });
    }

    function toggleCart() {
      const cartElement = document.getElementById('cart');
      cartElement.classList.toggle('active');
    }

    function shrinkCart() {
      const cartElement = document.getElementById('cart');
      shrinkState = !shrinkState;
      if (shrinkState) {
        cartElement.classList.add('shrink');
      } else {
        cartElement.classList.remove('shrink');
      }
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCart();
    }

    function updateCart() {
      const itemsEl = document.getElementById('cartItems');
      itemsEl.innerHTML = '';
      cart.forEach(item => {
        const li = document.createElement('li');
        li.innerText = `${item.name} - Rp${item.price}`;
        itemsEl.appendChild(li);
      });
      document.getElementById('totalItems').innerText = cart.length;
      updateTotal();
    }

    function updateTotal() {
      const pickup = document.getElementById('pickupMethod').value;
      let total = cart.reduce((acc, item) => acc + item.price, 0);
      if (pickup === 'antar') total += cart.length * 500;
      document.getElementById('totalPrice').innerText = total;
    }

    function checkoutWhatsApp() {
      const name = document.getElementById('buyerName').value;
      const pickup = document.getElementById('pickupMethod').value;
      const payment = document.getElementById('paymentMethod').value;
      let message = `Halo! Saya ingin memesan:\nNama: ${name}\nProduk:\n`;
      cart.forEach(item => {
        message += `- ${item.name} (Rp${item.price})\n`;
      });
      const total = document.getElementById('totalPrice').innerText;
      message += `Total: Rp${total}\nMetode Pengambilan: ${pickup}\nMetode Pembayaran: ${payment}`;
      const encoded = encodeURIComponent(message);
      window.open(`https://wa.me/6289664363463?text=${encoded}`);
    }
  </script>
</body>

</html>
