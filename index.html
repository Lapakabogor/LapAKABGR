<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LapAKABogor Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
    }
    header {
      background: linear-gradient(to right, #007bff, #dc3545, #28a745, #fd7e14);
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: white;
    }
    .top-bar input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .cart-button {
      position: relative;
      background: #007bff;
      color: white;
      padding: 0.5rem;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 1rem;
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 1rem;
    }
    .categories button {
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: #fd7e14;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .product-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .product {
      background: white;
      border: 1px solid #ccc;
      margin: 1rem;
      padding: 1rem;
      width: 200px;
      text-align: center;
      border-radius: 10px;
    }
    .product img {
      max-width: 100%;
      border-radius: 5px;
    }
    #cart {
      display: none;
      position: fixed;
      top: 70px;
      right: 10px;
      background: white;
      border: 1px solid #ccc;
      padding: 1rem;
      max-height: 300px;
      overflow-y: auto;
      width: 250px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LapAKABogor Store</h1>
    <p>Marketplace Mahasiswa Politeknik AKA Bogor</p>
  </header>

  <div class="top-bar">
    <input type="text" id="search" placeholder="Cari produk...">
    <div class="cart-button" onclick="toggleCart()">
      <i class="fa fa-shopping-cart"></i>
      <span id="cart-count">0</span>
    </div>
  </div>

  <div class="categories">
    <button onclick="filterCategory('Semua')">Semua</button>
    <button onclick="filterCategory('Makanan Berat')">Makanan Berat</button>
    <button onclick="filterCategory('Makanan Ringan')">Makanan Ringan</button>
    <button onclick="filterCategory('Minuman')">Minuman</button>
    <button onclick="filterCategory('Alat dan Bahan Kimia')">Alat dan Bahan Kimia</button>
    <button onclick="filterCategory('Produk Inovasi Mahasiswa')">Produk Inovasi Mahasiswa</button>
    <button onclick="filterCategory('Lain-lain')">Lain-lain</button>
  </div>

  <div class="product-list" id="product-list">
    <!-- Produk akan dimuat via JavaScript -->
  </div>

  <div id="cart">
    <h3>Keranjang</h3>
    <ul id="cart-items"></ul>
    <p>Total: <span id="cart-total">Rp0</span></p>
    <button onclick="checkoutWA()">Checkout via WhatsApp</button>
  </div>

  <script>
    const products = [
      { id: 1, name: "Nasi Goreng", category: "Makanan Berat", price: 12000, img: "https://via.placeholder.com/200" },
      { id: 2, name: "Keripik Pisang", category: "Makanan Ringan", price: 7000, img: "https://via.placeholder.com/200" },
      { id: 3, name: "Es Teh Manis", category: "Minuman", price: 5000, img: "https://via.placeholder.com/200" },
      { id: 4, name: "Etanol 70%", category: "Alat dan Bahan Kimia", price: 15000, img: "https://via.placeholder.com/200" },
      { id: 5, name: "Sabun Antiseptik Nano", category: "Produk Inovasi Mahasiswa", price: 10000, img: "https://via.placeholder.com/200" },
      { id: 6, name: "Souvenir AKA", category: "Lain-lain", price: 8000, img: "https://via.placeholder.com/200" },
    ];

    let cart = [];

    function renderProducts(filter = "Semua") {
      const list = document.getElementById("product-list");
      list.innerHTML = "";
      const search = document.getElementById("search").value.toLowerCase();
      products.filter(p => (filter === "Semua" || p.category === filter) && p.name.toLowerCase().includes(search)).forEach(p => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `<img src="${p.img}" alt="${p.name}"><h4>${p.name}</h4><p>Rp${p.price}</p><button onclick='addToCart(${JSON.stringify(p)})'>Tambah</button>`;
        list.appendChild(div);
      });
    }

    function addToCart(product) {
      cart.push(product);
      document.getElementById("cart-count").innerText = cart.length;
      updateCart();
    }

    function updateCart() {
      const items = document.getElementById("cart-items");
      const total = document.getElementById("cart-total");
      items.innerHTML = "";
      let sum = 0;
      cart.forEach(p => {
        const li = document.createElement("li");
        li.innerText = `${p.name} - Rp${p.price}`;
        items.appendChild(li);
        sum += p.price;
      });
      total.innerText = `Rp${sum}`;
    }

    function toggleCart() {
      const cartBox = document.getElementById("cart");
      cartBox.style.display = cartBox.style.display === "block" ? "none" : "block";
    }

    function checkoutWA() {
      let pesan = "Halo, saya ingin membeli:\n";
      cart.forEach(p => pesan += `- ${p.name} (Rp${p.price})\n`);
      const total = cart.reduce((acc, p) => acc + p.price, 0);
      pesan += `Total: Rp${total}`;
      window.open(`https://wa.me/6289664363463?text=${encodeURIComponent(pesan)}`);
    }

    function filterCategory(cat) {
      renderProducts(cat);
    }

    document.getElementById("search").addEventListener("input", () => renderProducts());
    window.onload = () => renderProducts();
  </script>
</body>
</html>
