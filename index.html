<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LapAKABogor Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      color: #333;
    }
    header {
      background: linear-gradient(to right, #007BFF, #FF4136, #2ECC40, #FF851B);
      color: white;
      text-align: center;
      padding: 1rem;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      padding: 1rem;
      background: white;
    }
    .carousel img {
      width: 300px;
      height: auto;
      border-radius: 10px;
    }
    section {
      padding: 1rem;
      background: white;
      margin: 1rem;
      border-radius: 10px;
    }
    .produk {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .produk-item {
      border: 1px solid #ddd;
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
      background: #fafafa;
    }
    .produk-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
    }
    button {
      padding: 0.5rem 1rem;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>LapAKABogor Store</h1>
    <p>Platform dagang produk mahasiswa Politeknik AKA Bogor</p>
  </header>

  <div class="carousel">
    <img src="promo1.jpg" alt="Promo 1">
    <img src="promo2.jpg" alt="Promo 2">
    <img src="promo3.jpg" alt="Promo 3">
  </div>

  <section>
    <h2>📦 Katalog Produk</h2>
    <div class="produk">
      <div class="produk-item">
        <img src="produk1.jpg" alt="Produk 1">
        <h3>Nasi Ayam</h3>
        <p>Rp12.000</p>
        <button onclick="addToCart('Nasi Ayam', 12000)">Tambah ke Keranjang</button>
      </div>
      <div class="produk-item">
        <img src="produk2.jpg" alt="Produk 2">
        <h3>Keripik Pisang</h3>
        <p>Rp7.000</p>
        <button onclick="addToCart('Keripik Pisang', 7000)">Tambah ke Keranjang</button>
      </div>
      <div class="produk-item">
        <img src="produk3.jpg" alt="Produk 3">
        <h3>Es Teh Manis</h3>
        <p>Rp5.000</p>
        <button onclick="addToCart('Es Teh Manis', 5000)">Tambah ke Keranjang</button>
      </div>
    </div>
  </section>

  <section>
    <h2>🛒 Keranjang Belanja</h2>
    <div id="cart"></div>
    <p><strong>Total:</strong> Rp<span id="total">0</span></p>

    <h3>Checkout</h3>
    <form id="checkout-form">
      <label>Nama: <input type="text" id="nama" required></label><br>
      <label>Prodi/Kelas: <input type="text" id="prodi" required></label><br>
      <label>Nomor WhatsApp: <input type="text" id="wa" required></label><br>
      <label>Alamat (diisi jika diantar): <input type="text" id="alamat"></label><br>
      <label>Pengambilan: 
        <select id="ambil">
          <option value="Ambil Sendiri">Ambil Sendiri</option>
          <option value="Diantar">Diantar (+Rp1.000/item)</option>
        </select>
      </label><br>
      <label>Pembayaran:
        <select id="bayar">
          <option value="Cash">Cash</option>
          <option value="QRIS">QRIS</option>
        </select>
      </label><br><br>
      <button type="button" onclick="checkoutWA()">Checkout via WhatsApp</button>
    </form>
  </section>

  <script>
    let cart = [];
    let total = 0;

    function addToCart(nama, harga) {
      let index = cart.findIndex(item => item.nama === nama);
      if (index !== -1) {
        cart[index].jumlah += 1;
      } else {
        cart.push({ nama, harga, jumlah: 1 });
      }
      updateCart();
    }

    function updateCart() {
      const cartDiv = document.getElementById("cart");
      cartDiv.innerHTML = "";
      total = 0;

      cart.forEach(item => {
        let subtotal = item.harga * item.jumlah;
        total += subtotal;
        cartDiv.innerHTML += `<p>${item.nama} x ${item.jumlah} = Rp${subtotal.toLocaleString()}</p>`;
      });

      document.getElementById("total").innerText = total.toLocaleString();
    }

    function checkoutWA() {
      const nama = document.getElementById("nama").value;
      const prodi = document.getElementById("prodi").value;
      const wa = document.getElementById("wa").value;
      const alamat = document.getElementById("alamat").value;
      const ambil = document.getElementById("ambil").value;
      const bayar = document.getElementById("bayar").value;

      if (!nama || !prodi || !wa) {
        alert("Harap isi semua kolom identitas!");
        return;
      }

      let pesan = `Halo! Saya ingin pesan di LapAKABogor%0A`;
      pesan += `Nama: ${nama}%0AProdi/Kelas: ${prodi}%0ANo. WA: ${wa}%0A`;
      if (ambil === "Diantar") pesan += `Alamat: ${alamat}%0A`;
      pesan += `Metode Pengambilan: ${ambil}%0AMetode Pembayaran: ${bayar}%0A%0A`;
      pesan += `🛍️ Daftar Belanjaan:%0A`;

      let ongkir = 0;
      cart.forEach(item => {
        pesan += `- ${item.nama} x ${item.jumlah} = Rp${(item.harga * item.jumlah).toLocaleString()}%0A`;
        if (ambil === "Diantar") ongkir += 1000 * item.jumlah;
      });

      pesan += `%0ASubtotal: Rp${total.toLocaleString()}`;
      if (ambil === "Diantar") {
        pesan += `%0AOngkir: Rp${ongkir.toLocaleString()}`;
        total += ongkir;
      }
      pesan += `%0ATotal: Rp${total.toLocaleString()}`;

      window.open(`https://wa.me/6289664363463?text=${pesan}`, "_blank");
    }
  </script>
</body>
</html>
